site_name: pi-lib
site_description: Documentação técnica e guias da piJunior
site_author: Diretoria de Projetos

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - search.suggest

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js

nav:
  - Início: index.md
  - Ferramentas:
      - Git e GitHub: tools/git-github.md
      - MkDocs: tools/docs.md